laravel: '@testbench'

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Workbench\App\Providers\Filament\AdminPanelProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

env:
  - APP_NAME='Vitals Workbench'
  # VitalsDemoSeeder only seeds in the local environment.
  - APP_ENV=local
  - AUTH_MODEL='Workbench\App\Models\User'

# Migrations materialized into the skeleton by the publish step below.
# `composer build` purges them in a separate process first: package-tools picks
# migration filenames when it boots, so purging inside workbench:build would
# reuse the old, earlier timestamps and sort them before create_monitors_table.
purge:
  files:
    - database/migrations/*_create_monitors_table.php
    - database/migrations/*_add_vitals_columns_to_monitors_table.php
    - database/migrations/*_create_vitals_monitor_*_table.php

workbench:
  start: '/admin'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: false
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - filament-assets
    # One step: the build keys steps by name, so a second vendor-publish would
    # replace the first. "migrations" is spatie/laravel-uptime-monitor's tag.
    - vendor-publish:
        --tag:
          - migrations
          - vitals-migrations
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
