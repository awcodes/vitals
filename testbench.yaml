laravel: '@testbench'

providers:
  # Listed even though package discovery also registers it: Larastan boots
  # Testbench without the discovery cache, and needs the vitals:: view
  # namespace to check view names. Laravel registers a provider only once.
  - Awcodes\Vitals\VitalsServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Workbench\App\Providers\Filament\AdminPanelProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

env:
  - APP_NAME='Vitals Workbench'
  # VitalsDemoSeeder only seeds in the local environment.
  - APP_ENV=local
  - AUTH_MODEL='Workbench\App\Models\User'

# Files materialized into the skeleton by vitals:install below.
# `composer build` purges them in a separate process first: package-tools picks
# migration filenames when it boots, so purging inside workbench:build would
# reuse the old, earlier timestamps and sort them before create_monitors_table.
purge:
  files:
    - database/migrations/*_create_monitors_table.php
    - database/migrations/*_add_vitals_columns_to_monitors_table.php
    - database/migrations/*_create_vitals_monitor_*_table.php
    - config/vitals.php
    - config/uptime-monitor.php

workbench:
  start: '/admin'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: false
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - filament-assets
    # The documented installation path: publishes the uptime-monitor config
    # and migration, then the Vitals config and migrations.
    - vitals-install:
        --no-interaction: true
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
